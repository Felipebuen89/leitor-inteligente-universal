<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar Leitor IA</title><meta name="theme-color" content="#0c1017"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0c1017;color:#eff4ff;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:440px;background:#172235;border:1px solid #324563;border-radius:18px;padding:28px}h1{font-size:24px}p{line-height:1.7;color:#adbed8}a{display:block;background:#6c94ec;color:#06162b;padding:14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:700}</style></head><body><main><h1>Atualizando Leitor IA</h1><p id="status">Apagando somente o cache antigo do aplicativo web. Nenhum aplicativo bancário será acessado.</p><a href="./?atualizado=4">Abrir a versão nova</a><p>Se o ícone da tela inicial ainda aparecer com faixas, remova o atalho antigo e adicione novamente pelo Safari.</p></main><script>(async()=>{const el=document.getElementById("status");try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes("/leitor-inteligente-universal/")).map(r=>r.unregister()));}if("caches" in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith("leitor-universal-web-")).map(k=>caches.delete(k)));}el.textContent="Cache atualizado. Abrindo a versão corrigida...";window.location.replace("./?atualizado=4&ts="+Date.now());}catch(e){el.textContent="Não foi possível limpar automaticamente. Toque no botão abaixo para abrir a versão atualizada.";}})();</script></body></html>

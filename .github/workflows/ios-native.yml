name: Verificar build iOS 27

on:
  push:
    branches: [main]
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4
      - name: Ambiente Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Gerar projeto Xcode
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Compilar para iPhone físico (sem assinatura)
        run: |
          xcodebuild -project LeitorInteligenteIOS.xcodeproj \
            -scheme LeitorInteligenteIOS -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.derivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar IPA de teste sem assinatura
        run: |
          mkdir -p build-ipa/Payload
          test -d .derivedData/Build/Products/Debug-iphoneos/LeitorInteligenteIOS.app
          cp -R .derivedData/Build/Products/Debug-iphoneos/LeitorInteligenteIOS.app build-ipa/Payload/
          (cd build-ipa && zip -qry LeitorInteligenteIOS-SEM-ASSINATURA.ipa Payload)
      - name: Arquivo de teste para assinatura posterior
        uses: actions/upload-artifact@v4
        with:
          name: Leitor-iPhone-iOS27-sem-assinatura
          path: ios-native/build-ipa/LeitorInteligenteIOS-SEM-ASSINATURA.ipa
          if-no-files-found: error
